name: Build reference catalog

on:
  push:
    paths:
      - "data/고등학교교과및과목검증기준.md"
      - "scripts/build_reference_catalog.py"
      - ".github/workflows/build-reference-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate reference catalog
        run: python scripts/build_reference_catalog.py

      - name: Commit updated catalog
        run: |
          if [ -z "$(git status --porcelain -- data/reference_catalog.json)" ]; then
            echo "reference_catalog.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reference_catalog.json
          git commit -m "Build reference catalog"
          git push origin "HEAD:${GITHUB_REF_NAME}"
